<style>
:root{box-sizing:border-box;--bg:#FFD23F;--ink:#2B1B5A;--card:#FFF8E1;--accent:#FF4F8B}
*{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:#FFD23F}
body{font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;color:var(--ink);font-size:min(1.6vw,2.8vh);transition:background .8s}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4em 6em;opacity:0;visibility:hidden;transition:opacity .8s;background:var(--bg);overflow:hidden}
.slide.on{opacity:1;visibility:visible}
.slide:before,.slide:after{content:"";position:absolute;border-radius:50%;background:var(--accent);opacity:.18}
.slide:before{width:16em;height:16em;left:-5em;top:-5em}
.slide:after{width:22em;height:22em;right:-8em;bottom:-9em}
.slide>*{position:relative;z-index:1}
.tag{background:var(--ink);color:#fff;font-weight:700;font-size:2em;padding:.3em 1.2em;border-radius:99em;transform:rotate(-2deg);margin-bottom:.9em}
.big{font-weight:700;font-size:4em;line-height:1.15;max-width:19em;margin:0}
.mid{font-weight:600;font-size:3em;line-height:1.25;max-width:22em;margin:0}
.sm{font-weight:600;font-size:2.2em;line-height:1.3;max-width:30em;margin:.5em 0 0}
.punch{margin-top:.8em;font-weight:700;font-size:4.4em;color:var(--accent);background:var(--card);padding:.2em .7em;border-radius:.5em;transform:rotate(1.5deg);box-shadow:.15em .15em 0 var(--ink);opacity:0}
.on .punch{animation:pop .6s 9s forwards cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(1.5deg)}}
.count{font-size:10em;font-weight:700;line-height:1;color:var(--accent);text-shadow:.04em .04em 0 var(--ink)}
.lbl{font-weight:700;font-size:2.2em;margin-top:.5em}
.pill{display:inline-block;background:var(--card);padding:.1em .6em;border-radius:99em;margin:.12em;font-weight:600;font-size:2.4em;box-shadow:.06em .06em 0 var(--ink)}
.star{margin-top:.8em;font-weight:700;font-size:2.6em;color:var(--accent);background:var(--card);padding:.15em .7em;border-radius:.5em;box-shadow:.1em .1em 0 var(--ink)}
.wrow{background:var(--card);border-radius:.6em;padding:.25em .9em;margin-top:.5em;font-weight:600;font-size:2em;box-shadow:.08em .08em 0 var(--ink);max-width:34em}
.s-blague{--bg:#FFD23F;--accent:#FF4F8B}.s-fait{--bg:#FF9F45;--accent:#2B1B5A}.s-rec{--bg:#9BE564;--accent:#D6336C}.s-anec{--bg:#3DD9C8;--accent:#6C2BD9}.s-meteo{--bg:#7CC8FF;--accent:#FF6B1A}.s-fl{--bg:#FFB3C7;--accent:#1A9E8F}.s-pos{--bg:#FF8FB1;--accent:#1A9E8F}.s-mission{--bg:#B79CFF;--accent:#FF6B1A}.s-we{--bg:#FFE066;--accent:#FF4F8B}.s-news{--bg:#A8E6CF;--accent:#0A439B}.s-hist{--bg:#FFCBA4;--accent:#2B1B5A}
.steps{text-align:left;font-weight:600;font-size:1.6em;line-height:1.35;max-width:42em;margin:.5em 0 0;padding-left:1.3em}.steps li{margin:.2em 0}
#bar{position:fixed;left:0;right:0;bottom:0;height:.5em;background:rgba(43,27,90,.2);z-index:5}
#bar i{display:block;height:100%;width:0;background:var(--ink)}
#clock{position:fixed;right:1em;top:.6em;font-weight:700;font-size:2.4em;background:var(--ink);color:#fff;padding:.1em .6em;border-radius:99em;z-index:5}
@media (prefers-reduced-motion:reduce){.on .punch{animation:none;opacity:1}}
</style>
</head>

function today(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5)}
var D=today();
function pick(a,o){return a[(D+(o||0))%a.length]}
function $(i){return document.getElementById(i)}
function pills(id,arr){var el=$(id);el.innerHTML="";arr.forEach(function(t){var s=document.createElement("span");s.className="pill";s.textContent=t;el.appendChild(s)})}

function setText(){
D=today();var M=new Date().getMonth();
var j=pick(BLAGUES);$("jq").textContent=j[0];$("ja").textContent=j[1];
var s=SEAS[M];$("ft").textContent="Fun fact : "+s[0];$("ff").textContent=pick(s[1]);
var r=REC[SAISON[M]],week=Math.floor(D/7),rc=r[1][week%r[1].length];
$("rt").textContent=r[0];$("rn").textContent=rc[0];$("rm").textContent=rc[1];$("ri").textContent="Ingrédients : "+rc[2]+".";
var ol=$("rs");ol.innerHTML="";rc[3].split("|").forEach(function(x){var li=document.createElement("li");li.textContent=x;ol.appendChild(li)});
$("an").textContent=pick(ANECDOTES);
$("ft2").textContent="Fruits et légumes de "+MOIS[M];
pills("fr",FL[M][0]);pills("lg",FL[M][1]);
var all=FL[M][0].concat(FL[M][1]),sp=pick(all);$("st").textContent="Star du jour : "+sp;$("sf").textContent=FUN[sp]||"";
if(FRESH.length){var nw=pick(FRESH);$("nt").textContent=nw.t;$("ns").textContent="Source : "+nw.s}
$("po").textContent=pick(POSITIF);$("mi").textContent=pick(MISSIONS);
}

function cat(i){
var d=W,c=d.weather_code[i],t=d.temperature_2m_max[i],pp=d.precipitation_probability_max[i],w=d.wind_speed_10m_max[i];
if(c>=95)return"orage";
if((c>=71&&c<=77)||c===85||c===86)return"neige";
if((c>=51&&c<=67)||(c>=80&&c<=82)||pp>=70)return"pluie";
if(c===45||c===48)return"brouillard";
if(w>=50)return"vent";
if(t<=4)return"glace";if(t<12)return"frais";if(t<22)return(c>=2?"gris":"doux");if(t<30)return"chaud";return"canicule";
}
var W=null,JOURS=["Aujourd’hui","Demain","Après-demain"];
function renderW(){
if(!W)return;
try{
for(var i=0;i<3;i++){
var tx=Math.round(W.temperature_2m_max[i]),tn=Math.round(W.temperature_2m_min[i]),ph=pick(HUM[cat(i)],i);
if(i===0){$("w0").textContent=ph;$("w0t").textContent="Aujourd’hui : "+tn+"° le matin, "+tx+"° l’après-midi"}
else{var e=$("w"+i);e.style.display="";e.textContent=JOURS[i]+" ("+tn+"° / "+tx+"°) : "+ph}
}
$("sw").classList.remove("off")}catch(x){}}
function loadW(){
try{fetch("https://api.open-meteo.com/v1/forecast?latitude=43.545&longitude=1.512&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=Europe%2FParis&forecast_days=3")
.then(function(r){if(!r.ok)throw 1;return r.json()}).then(function(j){W=j.daily;renderW()}).catch(function(){if(!W)setTimeout(loadW,120000)})}catch(e){}
}

function easter(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function holidays(y){var e=easter(y),p=function(n){return new Date(e.getFullYear(),e.getMonth(),e.getDate()+n)};
return[[new Date(y,0,1),"le Jour de l’An"],[p(1),"le lundi de Pâques"],[new Date(y,4,1),"la Fête du Travail"],[new Date(y,4,8),"le 8 mai"],[p(39),"l’Ascension"],[p(50),"le lundi de Pentecôte"],[new Date(y,6,14),"la Fête nationale"],[new Date(y,7,15),"l’Assomption"],[new Date(y,10,1),"la Toussaint"],[new Date(y,10,11),"l’Armistice"],[new Date(y,11,25),"Noël"]]}
function nextHoliday(){var n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),all=holidays(n.getFullYear()).concat(holidays(n.getFullYear()+1));
for(var k=0;k<all.length;k++){var dd=Math.round((all[k][0]-t0)/864e5);if(dd>=0){var el=$("jf");el.textContent=dd===0?"Aujourd’hui, c’est férié : "+all[k][1]+" !":"Prochain jour férié : "+all[k][1]+", dans "+dd+(dd>1?" jours":" jour");return}}}
function loadH(){
try{var n=new Date(),mm=("0"+(n.getMonth()+1)).slice(-2),dd=("0"+n.getDate()).slice(-2);
fetch("https://fr.wikipedia.org/api/rest_v1/feed/onthisday/events/"+mm+"/"+dd).then(function(r){return r.json()}).then(function(j){
var ev=(j.events||[]).filter(function(x){return x.year&&x.text&&x.text.length<=170});
if(!ev.length)return;var e=ev[D%ev.length];$("hy").textContent=e.year;$("ht").textContent=e.text;$("sh").classList.remove("off")}).catch(function(){})}catch(x){}
}
function weekend(){nextHoliday();
var n=new Date(),d=n.getDay(),h=n.getHours(),cn=$("cn"),cl=$("cl");
if(d===0||d===6||(d===5&&h>=17)){cn.textContent="Yes !";cl.textContent="C’est le week-end, profitez-en bien !";return}
if(d===5){cn.textContent=(17-h)+" h";cl.textContent="avant le week-end. Courage, on y est presque !";return}
var left=5-d;cn.textContent=left+(left>1?" jours":" jour");cl.textContent="avant le week-end (vendredi 17h)";
}
function clock(){var n=new Date();$("clock").textContent=("0"+n.getHours()).slice(-2)+":"+("0"+n.getMinutes()).slice(-2)}

fresh();if(!FRESH.length){var sn=$("sn");sn.parentNode.removeChild(sn)}
var slides=[].slice.call(document.querySelectorAll(".slide")),i=-1,t;
function next(){
do{i=(i+1)%slides.length}while(slides[i].classList.contains("off"));
if(i===0){setText();weekend();renderW()}
slides.forEach(function(s,k){s.classList.toggle("on",k===i)});
document.body.style.background=getComputedStyle(slides[i]).getPropertyValue("--bg");
var d=+slides[i].dataset.d,f=$("fill");
f.style.transition="none";f.style.width="0";f.offsetWidth;f.style.transition="width "+d+"ms linear";f.style.width="100%";
clearTimeout(t);t=setTimeout(next,d);
}
setText();weekend();clock();setInterval(clock,10000);loadW();setInterval(loadW,1800000);loadH();setInterval(loadH,3600000);next();
